name: Check

on:
  push:
    branches: ["main", "dev", "feat/**", "fix/**", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Provide a dummy key so the mock LLM provider initialises without error.
      # Real API calls are not made during repository checks.
      METAVIEW_LLM_API_KEY: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          python3 -m venv .venv
          .venv/bin/pip install -r apps/api/requirements-dev.txt

      - name: Lint
        run: make lint

      # The narration speakability guard scans the frozen template playbooks,
      # which live in gitignored data/ as a build artifact. Without this the
      # corpus is empty on CI and the guard silently protects nothing.
      - name: Export template playbooks
        run: npm --workspace apps/web run template-previews:export

      - name: Test API
        run: .venv/bin/pytest apps/api/tests -q

      - name: Test Web mobile regression
        run: npm --workspace apps/web run test -- src/styles/mobilePlayerRegression.test.ts

      - name: Test Web player contracts
        run: >-
          npm --workspace apps/web run test --
          src/features/playbook/engine/player/PlaybookPlayer.test.tsx
          src/styles/mobileWebSmoke.test.tsx

      - name: Test Web
        run: >-
          npm --workspace apps/web run test --
          --reporter=json
          --outputFile=../../web-test-results.json

      - name: Upload Web test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results-${{ github.run_id }}
          path: web-test-results.json
          if-no-files-found: warn
          retention-days: 7

      - name: Test Agent
        run: npm --workspace apps/agent run test

      - name: Test MCP
        run: npm --workspace apps/mcp-server run test

      - name: Build Web
        run: npm --workspace apps/web run build

      - name: Build Agent
        run: npm --workspace apps/agent run build

      - name: Coverage (PR-only)
        if: github.event_name == 'pull_request'
        run: make test-coverage

      - name: Upload coverage reports
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage/
            apps/web/coverage/
          if-no-files-found: ignore
          retention-days: 14
