server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Content-hashed bundles never change under the same name — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else (index.html, SEO pages, posters) must revalidate on each
    # load, so a fresh deploy shows up on a plain refresh instead of after an
    # unpredictable heuristic-cache window. no-cache still permits ETag 304s.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /__spa__/index.html;
    }
}
