    <meta

    <style>
      .mv-boot-fallback {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;

        align-content: center;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      }
      .mv-boot-fallback strong {
        font-size: 18px;
        font-weight: 650;
      }
      .mv-boot-fallback span {
        max-width: 360px;
        color: #5d655f;
        font-size: 13px;
        line-height: 1.6;
      }
    </style>

    <div id="root">
      <div class="mv-boot-fallback" role="status">
        <strong>MetaView 正在启动</strong>
        <span>如果页面长时间停留在这里，请刷新并确认浏览器允许 JavaScript。</span>
