services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        APT_PIPELINE_DEPTH: ${APT_PIPELINE_DEPTH:-0}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
        PIP_FIND_LINKS: ${PIP_FIND_LINKS:-/tmp/wheelhouse}
    environment:
      METAVIEW_DEFAULT_PROVIDER: ${METAVIEW_DEFAULT_PROVIDER:-mock}
      METAVIEW_DEFAULT_ROUTER_PROVIDER: ${METAVIEW_DEFAULT_ROUTER_PROVIDER:-mock}
      METAVIEW_DEFAULT_GENERATION_PROVIDER: ${METAVIEW_DEFAULT_GENERATION_PROVIDER:-mock}
      METAVIEW_APP_EDITION: ${METAVIEW_APP_EDITION:-self}
      METAVIEW_MOCK_PROVIDER_ENABLED: ${METAVIEW_MOCK_PROVIDER_ENABLED:-true}
      METAVIEW_ENABLED_DOMAINS: ${METAVIEW_ENABLED_DOMAINS:-algorithm,math,code,physics,chemistry,biology,geography}
      METAVIEW_MAX_REPAIR_ATTEMPTS: ${METAVIEW_MAX_REPAIR_ATTEMPTS:-2}
      METAVIEW_HISTORY_DB_PATH: ${METAVIEW_HISTORY_DB_PATH:-data/pipeline_runs.db}
      METAVIEW_CORS_ORIGIN_REGEX: ${METAVIEW_CORS_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1)(:\d+)?$$}
      METAVIEW_PLAYBOOK_DEFAULT_FPS: ${METAVIEW_PLAYBOOK_DEFAULT_FPS:-30}
      METAVIEW_PLAYBOOK_DEFAULT_STEP_FRAMES: ${METAVIEW_PLAYBOOK_DEFAULT_STEP_FRAMES:-60}
      METAVIEW_PLAYBOOK_COMPOSITION_WIDTH: ${METAVIEW_PLAYBOOK_COMPOSITION_WIDTH:-960}
      METAVIEW_PLAYBOOK_COMPOSITION_HEIGHT: ${METAVIEW_PLAYBOOK_COMPOSITION_HEIGHT:-540}
      METAVIEW_OPENAI_API_KEY: ${METAVIEW_OPENAI_API_KEY:-}
      METAVIEW_OPENAI_BASE_URL: ${METAVIEW_OPENAI_BASE_URL:-https://api.openai.com/v1}
      METAVIEW_OPENAI_MODEL: ${METAVIEW_OPENAI_MODEL:-}
      METAVIEW_OPENAI_SUPPORTS_VISION: ${METAVIEW_OPENAI_SUPPORTS_VISION:-false}
      METAVIEW_OPENAI_TIMEOUT_S: ${METAVIEW_OPENAI_TIMEOUT_S:-300}
      # Agent sidecar wiring — only used when generation_mode=agent.
      METAVIEW_GENERATION_MODE: ${METAVIEW_GENERATION_MODE:-single}
      METAVIEW_AGENT_PROVIDER: ${METAVIEW_AGENT_PROVIDER:-http}
      METAVIEW_AGENT_BASE_URL: ${METAVIEW_AGENT_BASE_URL:-http://agent:8001}
      METAVIEW_AGENT_TIMEOUT_S: ${METAVIEW_AGENT_TIMEOUT_S:-600}
      METAVIEW_AGENT_SHARED_TOKEN: ${METAVIEW_AGENT_SHARED_TOKEN:-}
      METAVIEW_CODEX_MODEL: ${METAVIEW_CODEX_MODEL:-}
      METAVIEW_CODEX_EFFORT: ${METAVIEW_CODEX_EFFORT:-}
      METAVIEW_CODEX_CWD: ${METAVIEW_CODEX_CWD:-.}
      METAVIEW_ACCOUNT_SESSION_COOKIE: ${METAVIEW_ACCOUNT_SESSION_COOKIE:-mv_session}
      METAVIEW_ACCOUNT_SESSION_DAYS: ${METAVIEW_ACCOUNT_SESSION_DAYS:-30}
      METAVIEW_ACCOUNT_SESSION_SECURE: ${METAVIEW_ACCOUNT_SESSION_SECURE:-false}
      METAVIEW_RECHARGE_MIN_CENTS: ${METAVIEW_RECHARGE_MIN_CENTS:-500}
      METAVIEW_GENERATION_COST_CENTS: ${METAVIEW_GENERATION_COST_CENTS:-10}
      METAVIEW_WECHAT_LOGIN_APPID: ${METAVIEW_WECHAT_LOGIN_APPID:-}
      METAVIEW_WECHAT_LOGIN_SECRET: ${METAVIEW_WECHAT_LOGIN_SECRET:-}
      METAVIEW_WECHAT_LOGIN_REDIRECT_URI: ${METAVIEW_WECHAT_LOGIN_REDIRECT_URI:-}
      METAVIEW_WECHAT_LOGIN_SUCCESS_URL: ${METAVIEW_WECHAT_LOGIN_SUCCESS_URL:-http://127.0.0.1:5173/}
      METAVIEW_WECHAT_PAY_APPID: ${METAVIEW_WECHAT_PAY_APPID:-}
      METAVIEW_WECHAT_PAY_MCHID: ${METAVIEW_WECHAT_PAY_MCHID:-}
      METAVIEW_WECHAT_PAY_MERCHANT_SERIAL_NO: ${METAVIEW_WECHAT_PAY_MERCHANT_SERIAL_NO:-}
      METAVIEW_WECHAT_PAY_PRIVATE_KEY_PATH: ${METAVIEW_WECHAT_PAY_PRIVATE_KEY_PATH:-}
      METAVIEW_WECHAT_PAY_PRIVATE_KEY: ${METAVIEW_WECHAT_PAY_PRIVATE_KEY:-}
      METAVIEW_WECHAT_PAY_API_V3_KEY: ${METAVIEW_WECHAT_PAY_API_V3_KEY:-}
      METAVIEW_WECHAT_PAY_NOTIFY_URL: ${METAVIEW_WECHAT_PAY_NOTIFY_URL:-}
      METAVIEW_WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH: ${METAVIEW_WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:-}
      METAVIEW_WECHAT_PAY_API_BASE: ${METAVIEW_WECHAT_PAY_API_BASE:-https://api.mch.weixin.qq.com}
      METAVIEW_WECHAT_NOTIFY_MAX_SKEW_S: ${METAVIEW_WECHAT_NOTIFY_MAX_SKEW_S:-300}
      METAVIEW_WECHAT_NOTIFY_REPLAY_TTL_S: ${METAVIEW_WECHAT_NOTIFY_REPLAY_TTL_S:-600}
      METAVIEW_PAYMENT_GATEWAY: ${METAVIEW_PAYMENT_GATEWAY:-wechat}
      METAVIEW_EPAY_SUBMIT_URL: ${METAVIEW_EPAY_SUBMIT_URL:-}
      METAVIEW_EPAY_API_BASE: ${METAVIEW_EPAY_API_BASE:-}
      METAVIEW_EPAY_SUBMIT_PATH: ${METAVIEW_EPAY_SUBMIT_PATH:-/submit.php}
      METAVIEW_EPAY_PID: ${METAVIEW_EPAY_PID:-}
      METAVIEW_EPAY_KEY: ${METAVIEW_EPAY_KEY:-}
      METAVIEW_EPAY_MERCHANT_ID: ${METAVIEW_EPAY_MERCHANT_ID:-}
      METAVIEW_EPAY_API_KEY: ${METAVIEW_EPAY_API_KEY:-}
      METAVIEW_EPAY_PAY_TYPE: ${METAVIEW_EPAY_PAY_TYPE:-alipay}
      METAVIEW_EPAY_SIGN_TYPE: ${METAVIEW_EPAY_SIGN_TYPE:-MD5}
      METAVIEW_EPAY_NOTIFY_URL: ${METAVIEW_EPAY_NOTIFY_URL:-}
      METAVIEW_EPAY_RETURN_URL: ${METAVIEW_EPAY_RETURN_URL:-}
      METAVIEW_NEWAPI_TOPUP_INTENT_SECRET: ${METAVIEW_NEWAPI_TOPUP_INTENT_SECRET:-}
      METAVIEW_NEWAPI_TOPUP_RECEIPT_TOKEN: ${METAVIEW_NEWAPI_TOPUP_RECEIPT_TOKEN:-}
      METAVIEW_NEWAPI_TOPUP_DEV_MODE: ${METAVIEW_NEWAPI_TOPUP_DEV_MODE:-false}
      METAVIEW_NEWAPI_TOPUP_ALLOWED_RETURN_ORIGINS: ${METAVIEW_NEWAPI_TOPUP_ALLOWED_RETURN_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      METAVIEW_NEWAPI_QUOTA_PER_YUAN: ${METAVIEW_NEWAPI_QUOTA_PER_YUAN:-500000}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    environment:
      # The sidecar reaches the FastAPI side over docker-compose's internal
      # network so the assert_* tools can call /api/v1/agent/assert/*.
      API_BASE_URL: ${AGENT_API_BASE_URL:-http://api:8000}
      AGENT_DEFAULT_PROVIDER: ${AGENT_DEFAULT_PROVIDER:-openai}
      AGENT_DEFAULT_MODEL: ${AGENT_DEFAULT_MODEL:-gpt-4o-mini}
      # Reuse the LLM key already configured for single-shot generation so
      # operators only manage one secret.
      AGENT_DEFAULT_API_KEY: ${METAVIEW_OPENAI_API_KEY:-}
      AGENT_SHARED_TOKEN: ${METAVIEW_AGENT_SHARED_TOKEN:-}
      LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
    depends_on:
      - api
    expose:
      - "8001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_APP_EDITION: ${VITE_APP_EDITION:-self}
    depends_on:
      - api
    ports:
      - "5173:80"
